name: Build and release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build release APK
        run: |
          chmod +x ./gradlew
          set -o pipefail
          ./gradlew assembleRelease --console=plain 2>&1 | tee build.log || {
            grep -E '^e: |error:|What went wrong' -A2 build.log | head -60 | while IFS= read -r l; do echo "::error::${l:0:900}"; done
            exit 1
          }

      - name: Name the APK
        run: |
          cp app/build/outputs/apk/release/app-release.apk "Hermes-v1.0.${{ github.run_number }}.apk"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Hermes 1.0.${{ github.run_number }}
          files: Hermes-v1.0.${{ github.run_number }}.apk
          make_latest: true
          generate_release_notes: true
